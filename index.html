<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schleppkurven-Prüfung</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --mute:#667085; --line:#d9dde4; --acc:#1f6feb; --bad:#d92d20; --ok:#1a7f37; --warn:#d97706; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:330px; flex:none; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:12px 14px 24px; }
  #main { flex:1; position:relative; min-width:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  h1 { font-size:16px; margin:0 0 10px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:18px 0 6px; border-top:1px solid var(--line); padding-top:12px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 9px; cursor:pointer; color:var(--ink); }
  button:hover, .btn:hover { border-color:var(--acc); }
  button.active { background:var(--acc); border-color:var(--acc); color:#fff; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; align-items:center; }
  .grid { display:grid; grid-template-columns:1fr 84px; gap:4px 8px; align-items:center; }
  input[type=number] { width:100%; font:inherit; padding:3px 5px; border:1px solid var(--line); border-radius:5px; }
  input[type=range] { width:100%; }
  #hint { background:#eef4ff; border:1px solid #cfe0ff; border-radius:6px; padding:6px 8px; margin:8px 0; min-height:2.8em; }
  .mute { color:var(--mute); }
  .stat { display:grid; grid-template-columns:1fr auto; gap:2px 8px; }
  .stat b { text-align:right; font-weight:600; }
  .bad { color:var(--bad); } .good { color:var(--ok); } .warn { color:var(--warn); }
  #tests div { margin:2px 0; }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(31,111,235,.15); font-size:20px; pointer-events:none; }
  #empty { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; padding:18px 24px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.2); text-align:center; }
  @media (max-width:760px){ #app{flex-direction:column} #side{width:100%;height:42%;border-right:0;border-bottom:1px solid var(--line)} }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Schleppkurven-Prüfung</h1>

    <h2 style="margin-top:6px;border:0;padding:0">1 · Lageplan</h2>
    <div class="row">
      <label class="btn">PDF laden…<input id="file" type="file" accept="application/pdf" hidden></label>
      <button id="blank">Leere Fläche (Test)</button>
    </div>
    <div class="row" id="pageRow" style="display:none">Seite <input id="pageNo" type="number" min="1" value="1" style="width:64px"> <span id="pageCnt" class="mute"></span></div>

    <h2>2 · Maßstab</h2>
    <div class="row"><button data-tool="scale">Maßstab setzen</button><button id="scaleReset">Zurücksetzen</button></div>
    <div id="scaleInfo" class="mute">nicht gesetzt</div>

    <h2>3 · Fahrzeug (PKW)</h2>
    <div class="grid">
      <label for="v_wb">Radstand [m]</label><input id="v_wb" type="number" step="0.01">
      <label for="v_front">Überhang vorn [m]</label><input id="v_front" type="number" step="0.01">
      <label for="v_rear">Überhang hinten [m]</label><input id="v_rear" type="number" step="0.01">
      <label for="v_width">Breite o. Spiegel [m]</label><input id="v_width" type="number" step="0.01">
      <label for="v_rout">Wendekreisradius außen [m]</label><input id="v_rout" type="number" step="0.01">
      <label for="v_track">Spurweite (Darstellung) [m]</label><input id="v_track" type="number" step="0.01">
    </div>
    <div id="vInfo" class="mute" style="margin-top:6px"></div>

    <h2>4 · Fahrweg &amp; Hindernisse</h2>
    <div class="row">
      <button data-tool="pan">Verschieben</button>
      <button data-tool="path">Fahrweg</button>
      <button data-tool="obst">Hindernis</button>
    </div>
    <div class="row">
      <button id="pathReverse">Richtung umkehren</button>
      <button id="pathClear">Fahrweg löschen</button>
      <button id="obstUndo">Letztes Hindernis löschen</button>
    </div>
    <div id="hint"></div>

    <h2>5 · Wiedergabe &amp; Anzeige</h2>
    <div class="row"><button id="play">▶ Abspielen</button><span class="mute" id="posInfo"></span></div>
    <input id="pos" type="range" min="0" max="1000" value="0">
    <div class="row"><label><input type="checkbox" id="oSweep" checked> Hüllfläche</label>
      <label><input type="checkbox" id="oSil" checked> Silhouetten alle</label>
      <input id="silStep" type="number" min="0.5" step="0.5" value="2" style="width:56px"> m</div>
    <div class="row"><button id="fit">Ansicht einpassen</button><button id="png">PNG exportieren</button></div>

    <h2>Ergebnis</h2>
    <div id="res" class="stat"></div>

    <h2>Selbsttest</h2>
    <div class="row"><button id="selftest">Kinematik prüfen</button></div>
    <div id="tests"></div>
  </aside>

  <main id="main">
    <canvas id="cv"></canvas>
    <div id="empty">PDF-Lageplan hierher ziehen oder links laden.<br><span class="mute">Alternativ „Leere Fläche (Test)“.</span></div>
    <div id="drop">PDF ablegen</div>
  </main>
</div>

<script src="vendor/pdf.min.js"></script>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
